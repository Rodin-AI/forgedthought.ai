:root {
  --navy: #0a1628;
  --navy-light: #132040;
  --slate: #8899b3;
  --cream: #e8eaf0;
  --white: #f4f5f7;
  --accent: #6b8aad;
}

section {
  background-color: var(--navy);
  color: var(--cream);
  font-family: 'EB Garamond', 'Georgia', 'Times New Roman', serif;
  font-size: 1.15rem;
  padding: 2.5rem 3.5rem;
  justify-content: flex-start;
}

h1 {
  color: var(--white);
  font-weight: 400;
  font-size: 2.6rem;
  margin-bottom: 0.3em;
  border-bottom: 3px solid var(--accent);
  padding-bottom: 0.3em;
}

h2 {
  color: var(--white);
  font-weight: 400;
  font-size: 1.9rem;
  margin-bottom: 0.4em;
  border-bottom: 1px solid var(--navy-light);
  padding-bottom: 0.2em;
}

h3 {
  color: var(--accent);
  font-weight: 400;
  font-size: 1.2rem;
  margin-bottom: 0.3em;
  font-style: italic;
}

p {
  color: var(--cream);
  line-height: 1.7;
  margin-bottom: 0.6em;
}

ul, ol {
  color: var(--cream);
  padding-left: 1.4em;
  line-height: 1.75;
}

li {
  margin-bottom: 0.3em;
}

strong {
  color: var(--white);
  font-weight: 600;
}

em {
  color: var(--slate);
  font-style: italic;
}

code {
  background: var(--navy-light);
  color: var(--accent);
  padding: 0.1em 0.35em;
  border-radius: 3px;
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 0.88em;
}

pre {
  background: var(--navy-light);
  border-left: 3px solid var(--accent);
  padding: 1em 1.2em;
  border-radius: 0 4px 4px 0;
  font-size: 0.85em;
}

blockquote {
  border-left: 3px solid var(--accent);
  padding-left: 1.2em;
  margin: 1em 0;
  color: var(--slate);
  font-style: italic;
}

.muted {
  color: var(--slate);
  font-size: 0.9em;
  font-style: italic;
}

/* Page number */
section::after {
  color: var(--slate);
  font-size: 0.75rem;
  font-family: 'EB Garamond', serif;
  font-style: italic;
}

/* Cover slide */
section.cover {
  justify-content: center;
  text-align: center;
  padding: 3rem;
}

section.cover h1 {
  font-size: 3.2rem;
  border: none;
  padding-bottom: 0;
}

section.cover .tagline {
  color: var(--slate);
  font-style: italic;
  font-size: 1.1rem;
  margin-top: 0.5em;
}

section.cover .byline {
  color: var(--slate);
  font-size: 0.85rem;
  margin-top: 2.5em;
}

/* Section divider */
section.divider {
  justify-content: center;
  text-align: center;
}

section.divider h1 {
  border: none;
  font-size: 2.8rem;
}

section.divider p {
  color: var(--slate);
  font-style: italic;
  font-size: 1.05rem;
}

/* Two-column layout */
.cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  margin-top: 0.5em;
}

.cols-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 1.5rem;
  margin-top: 0.5em;
}

/* Card */
.card {
  background: var(--navy-light);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 1em 1.2em;
}

.card h3 {
  margin-top: 0;
  font-style: normal;
}

/* Accent rule */
.rule {
  border: none;
  border-top: 2px solid var(--accent);
  margin: 1em 0;
  opacity: 0.5;
}

/* Loop diagram */
.loop {
  display: flex;
  align-items: center;
  gap: 0.6em;
  font-size: 0.95rem;
  color: var(--cream);
  flex-wrap: wrap;
  margin: 0.8em 0;
}

.loop-step {
  background: var(--navy-light);
  border: 1px solid var(--accent);
  border-radius: 3px;
  padding: 0.3em 0.7em;
  white-space: nowrap;
}

.loop-arrow {
  color: var(--accent);
  font-size: 1.2em;
}

/* Example boxes */
.example {
  background: var(--navy-light);
  border-left: 3px solid var(--accent);
  padding: 0.7em 1em;
  margin: 0.6em 0;
  font-size: 0.95rem;
}

.example .label {
  color: var(--slate);
  font-size: 0.8em;
  font-style: italic;
  display: block;
  margin-bottom: 0.2em;
}

/* Principle list */
.principles li {
  list-style: none;
  padding: 0.4em 0;
  border-bottom: 1px solid var(--navy-light);
}

.principles li:last-child {
  border-bottom: none;
}

.pl-title {
  color: var(--white);
  font-weight: 600;
}

.pl-body {
  color: var(--slate);
  font-style: italic;
  font-size: 0.9em;
}

<h2 id="executive-summary">Executive Summary</h2>
<p><strong>The goal:</strong> An AI that takes an issue from idea to merge-ready PR with no human involvement — and never lets quality slip through the cracks.</p>
<p><strong>The method:</strong> Not a single brilliant agent. A system of interlocking loops, each with one job, each checking the others.</p>
<div class="cols" style="margin-top: 1em">
<div class="card">
<h3 id="the-problem">The Problem</h3>
<p>Most AI coding tools are autocomplete with confidence. They generate code that compiles — and subtly fails in production. No system thinks about what the issue actually asked for. No system measures whether its own reviews change anything.</p>
</div>
<div class="card">
<h3 id="the-answer">The Answer</h3>
<p>A self-correcting loop. Design documents anchor intent. A dev loop builds and reviews. A post-merge review checks whether the issue was actually solved. Triage keeps the board clean. Each loop feeds the next.</p>

<h2 id="the-philosophy">The Philosophy</h2>
<blockquote>
<p><em>Think before acting. Run the checks before pushing. Rushing burns more time than patience ever will.</em></p>
</blockquote>
<p>This system is built on one conviction: <strong>quality is not a gate at the end — it's a property of the process.</strong></p>
<ul class="principles" style="margin-top: 1em">
<li><span class="pl-title">Slow is smooth, smooth is fast</span><br /><span class="pl-body">A design doc written up front saves five rebases later. Time spent orienting saves time spent correcting.</span></li>
<li><span class="pl-title">Two is one and one is none</span><br /><span class="pl-body">Verify everything. One review catches some things. Three independent reviews catch most things. Post-merge review catches the rest.</span></li>
<li><span class="pl-title">Don't guess. Don't assume.</span><br /><span class="pl-body">Every decision is anchored to a document. Every review is anchored to a commit SHA. Ambiguity compounds into debt.</span></li>
<li><span class="pl-title">The human's time is sacred</span><br /><span class="pl-body">Everything they see is finished, tested, reviewed, and clean. If it's not done, they don't see it. Assignment is the signal.</span></li>
</ul>

<h2 id="design-is-not-optional">Design Is Not Optional</h2>
<p>Most failures don't happen at code review. They happen earlier — when someone starts writing code without a clear picture of what <em>done</em> looks like.</p>
<p><strong>Without a design document:</strong></p>
<ul>
<li>The PR solves the wrong problem</li>
<li>Acceptance criteria are implicit — so they're never checked</li>
<li>Review bots find style issues instead of structural ones</li>
<li>After merge, there's no way to know if the issue was actually resolved</li>
</ul>
<p><strong>With a design document:</strong></p>
<div class="example">
<span class="label">Example — issue #120</span>
"GitHub PR review support" was filed. Before a line of code was written, a design doc specified: what APIs to call, what the output format must be, what error cases to handle, and what <em>done</em> looks like — 4 explicit acceptance criteria.
</div>
<p>The document becomes the contract. Every subsequent loop checks against it.</p>

<h2 id="the-pre-code-step">The Pre-Code Step</h2>
<p>Before any issue gets a PR, the <code>pre-code</code> skill runs. It produces a <strong>structured plan</strong> anchored to the issue.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Issue → Read issue body + comments
      → Identify acceptance criteria (explicit + implied)
      → Research the codebase for context
      → Write a plan: approach, file changes, test strategy
      → Get the plan approved
      → Only then: write code
</code></pre>
<p><strong>What the plan locks in:</strong></p>
<ul>
<li>The exact acceptance criteria that will be verified at post-merge review</li>
<li>The architectural approach — so review bots know <em>why</em> the code looks the way it does</li>
<li>The test strategy — so CI failures have a clear diagnosis path</li>
</ul>
<blockquote>The plan isn't documentation overhead. It's the input to every downstream loop.</blockquote>
</section>

<p>The design document doesn't get filed and forgotten. It's referenced at every stage:</p>
<div class="cols">
<div>
<p><strong>During development</strong><br />
The worker reads the plan before writing code. The plan specifies which files to touch — the worker doesn't guess.</p>
<p><strong>During review</strong><br />

<h2 id="the-dev-loop-overview">The Dev Loop: Overview</h2>
<p>The loop runs on a schedule. Every 10 minutes, it checks state and takes exactly one action. No ambiguity. One rule set. One action per run.</p>
<div class="loop" style="font-size: 1rem; margin: 1.2em 0">
  <div class="loop-step">Open PR?</div>
  <div class="loop-arrow">→ no →</div>
  <div class="loop-step">Open issues?</div>
  <div class="loop-arrow">→ no →</div>
  <div class="loop-step" style="border-color: var(--slate); color: var(--slate)">NO_REPLY</div>
</div>
<div class="loop" style="font-size: 1rem; margin: 0.2em 0 0.6em">
  <div class="loop-step">Open PR?</div>
  <div class="loop-arrow">→ no →</div>
  <div class="loop-step">Open issues?</div>
  <div class="loop-arrow">→ yes →</div>
  <div class="loop-step">Spawn dev worker</div>
  <div class="loop-arrow">→</div>
  <div class="loop-step">PR created</div>
</div>
<div class="loop" style="font-size: 1rem; margin: 0.6em 0">
  <div class="loop-step">PR open</div>
  <div class="loop-arrow">→</div>
  <div class="loop-step">Active worker?</div>
  <div class="loop-arrow">→</div>
  <div class="loop-step">CI green?</div>
  <div class="loop-arrow">→</div>
  <div class="loop-step">Reviews done?</div>
  <div class="loop-arrow">→</div>
  <div class="loop-step">Findings addressed?</div>
  <div class="loop-arrow">→</div>
  <div class="loop-step">Self-review?</div>
  <div class="loop-arrow">→</div>
  <div class="loop-step">Hand off</div>
</div>
<p><strong>The rules are a priority stack, not a checklist:</strong></p>
<ol start="0">
<li><strong>No open PR</strong> → check for open issues → spawn dev worker (pre-code → implement → open PR)</li>
<li>If an active worker is running → stop, don't interfere</li>
<li>If CI is failing → spawn a fix worker</li>
<li>If reviews have unaddressed findings → spawn a fix worker</li>
<li>If self-review is missing → spawn a self-review worker</li>
<li>If everything is clean → apply <code>ready</code>, assign to human</li>
</ol>
<p><em>Step 0 is how new work enters. Without it, the loop only maintains in-flight PRs — it never picks up anything new.</em></p>

<h2 id="self-correction-review-feedback">Self-Correction: Review Feedback</h2>
<p>When a bot posts <code>REQUEST_CHANGES</code>, the dev loop doesn't wait for a human to notice. The next run detects it and responds.</p>
<p><strong>The fix cycle:</strong></p>
<div class="example">
<span class="label">gargoyle PR #775 — real run, 2026-05-14</span>
gpt-review-bot posted 2 MAJOR findings against SHA <code>93d89ba6</code>. Next dev loop run: no fix plan exists for this SHA → add <code>wip</code> label → spawn worker with the findings. Worker addresses both, pushes new commit. Next run: new HEAD, reviews re-triggered. Bots re-review against the new SHA. All APPROVED → self-review worker spawned.
</div>
<p><strong>Why SHA-anchoring matters:</strong></p>
<p>Bots review against a specific commit. If the code changes, the old review is stale — even if it said APPROVED. The loop always checks: <em>are these reviews against the current HEAD?</em> A stale APPROVED is treated the same as no review.</p>

<h2 id="self-correction-ci-failures">Self-Correction: CI Failures</h2>
<p>CI failures are treated as blocking — not as noise to retry.</p>
<p><strong>The loop's CI protocol:</strong></p>
<ul>
<li>CI pending → wait (don't act on stale state)</li>
<li>CI failed → identify which job, spawn a targeted fix worker</li>
<li>CI passed, but reviews pending → wait for reviews (don't skip)</li>
<li>CI passed, all reviews green → proceed</li>
</ul>
<p><strong>What makes this work:</strong> The fix worker gets the specific failing job and its logs — not just &quot;CI failed.&quot; It reads the actual error, diagnoses it, fixes it, and pushes. No shotgun approaches.</p>
<div class="example">
<span class="label">review-bot — real pattern observed across dozens of runs</span>
When the <code>gpt-review-bot</code> CI job was still in-flight, the dev loop returned <code>NO_REPLY</code> five runs in a row. No premature action. When reviews landed, the loop immediately identified the findings and spawned a worker. Correct behavior both ways.
</div>

<h2 id="the-post-merge-review-loop">The Post-Merge Review Loop</h2>
<p>After a PR merges, the dev loop's job is done — but the <strong>post-merge review loop</strong> starts.</p>
<p><strong>The post-merge review runs hourly.</strong> It reads each merged PR, finds the linked issue, and checks:</p>
<ol>
<li>Were all acceptance criteria from the issue actually delivered?</li>
<li>Did the implementation match the approach in the design?</li>
<li>Are there any gaps that would cause silent failures later?</li>
</ol>
<p><strong>When it finds a gap → it files a new bug issue on Gitea.</strong> The issue includes:</p>
<ul>
<li>Which acceptance criterion was missed</li>
<li>What was delivered vs. what was required</li>
<li>A link back to the original issue and PR</li>
</ul>
<p>That bug issue then enters the normal issue backlog. The dev loop picks it up on the next cycle — pre-code, implement, review, post-merge review. <strong>The gap closes itself.</strong></p>
<div class="example">
<span class="label">gargoyle PR #771 — post-merge review</span>
Criterion 2 ("document chosen approach in design doc") not met — only an inline comment, nothing in <code>docs/</code>. → Filed issue #773. Dev loop picked it up. PR #774 delivered the doc. Post-merge review confirmed all criteria satisfied.
</div>

<h2 id="the-triage-loop">The Triage Loop</h2>
<p>The triage loop runs every 30 minutes. Its job is <strong>observation, not execution.</strong></p>
<p><strong>What it does:</strong></p>
<ul>
<li><strong>Checks issue quality:</strong> does every open issue have a problem statement and acceptance criteria? If not, adds <code>needs-detail</code> label — the dev loop will not pick up a thin issue</li>
<li>Syncs dependency labels: if a blocking issue closes, remove <code>blocked</code> from downstream issues</li>
<li>Flags oversized issues: <code>size:L</code> or <code>size:XL</code> without <code>needs-split</code> → add the label</li>
<li>Checks PR state: are PRs that are fully reviewed and approved correctly labeled?</li>
</ul>
<p><strong>What it explicitly does NOT do:</strong></p>
<ul>
<li>Touch PR labels (that's the dev loop's job)</li>
<li>Trigger the dev loop (they run independently on their own schedules)</li>
<li>Fix anything — it observes, labels, and reports</li>
</ul>
<p><strong>Why issue quality checking belongs here:</strong><br />
The dev loop's pre-code step needs acceptance criteria to produce a valid design doc. An issue without them produces a design doc full of assumptions — and the post-merge review will file bugs when reality diverges. Catching thin issues at triage breaks the cycle before it starts.</p>
<blockquote>Triage is the immune system. It doesn't build anything — it keeps the board honest so every downstream loop always has accurate, complete state to work from.</blockquote>

<h2 id="docs-are-the-memory">Docs Are the Memory</h2>
<p>An AI has no persistent state between sessions. Every loop run starts cold. <strong>Documentation is the only continuity.</strong></p>
<p>Without docs, every loop run has to re-derive context from the codebase. With docs, each run reads the relevant document and immediately knows:</p>
<ul>
<li>What the system is supposed to do</li>
<li>What was decided and why</li>
<li>What the current PR is trying to accomplish</li>
</ul>
<p><strong>Two kinds of docs, two different jobs:</strong></p>
<div class="cols">
<div class="card">
<h3 id="domain-docs">Domain docs</h3>
<p><em>What the system is and why it works the way it does.</em></p>
<p>Survives rewrites. Stable. Example: &quot;The OrderManager owns placement, tracking, and deduplication of orders. An order exists from intent to fill — the manager is the authority on its state.&quot;</p>
</div>
<div class="card">
<h3 id="implementation-docs">Implementation docs</h3>
<p><em>How the current code does it — frameworks, data structures, patterns.</em></p>
<p>Tied to the implementation. Updated when the approach changes. Example: &quot;Using <code>Process.get/put</code> in <code>init/1</code> for per-test isolation.&quot;</p>
</div>
</div>

<h2 id="docs-as-loop-fuel">Docs as Loop Fuel</h2>
<p>Every loop reads the same documents. What shifts is the <em>perspective</em> — the question being asked of them.</p>
<div class="cols-3">
<div class="card">
<h3 id="pre-code">Pre-code</h3>
<p><em>Perspective:</em> What do I need to build?</p>
<p>Issue + codebase + domain docs → produces the design doc and acceptance criteria that anchor everything downstream.</p>
</div>
<div class="card">
<h3 id="dev-loop">Dev loop</h3>
<p><em>Perspective:</em> Is this implementation correct?</p>
<p>Same docs + PR diff + review comments → evaluates whether the code matches the intent, not just whether it compiles.</p>
</div>
<div class="card">
<h3 id="post-merge-review">Post-merge review</h3>
<p><em>Perspective:</em> Did this deliver what was promised?</p>
<p>Same docs + merged diff → checks reality against the original acceptance criteria, cold, after the fact.</p>
</div>
</div>
<blockquote>The docs don't change. The question does. That's what makes each loop see something different in the same material.</blockquote>

<h2 id="review-personas-narrow-questions-beat-broad-mandates">Review Personas: Narrow Questions Beat Broad Mandates</h2>
<p>&quot;Review this code for quality&quot; is not a useful prompt. It spreads attention thin and produces generic feedback. <strong>A persona is a reviewer with a specific job, a specific lens, and a specific patterns library.</strong></p>
<p>review-bot runs four personas against every PR:</p>
<div class="cols">
<div class="card">
<h3 id="security-reviewer">security-reviewer</h3>
<p>Looks for input validation, auth boundaries, injection paths, secrets exposure. Every finding framed as: <em>what's the attack surface?</em></p>
<h3 id="elixir-otp-reviewer">elixir-otp-reviewer</h3>
<p>Looks for OTP anti-patterns: blocking GenServers, wrong supervision strategy, misused <code>Process.sleep</code>, race conditions in message ordering.</p>
</div>
<div class="card">
<h3 id="trading-domain-reviewer">trading-domain-reviewer</h3>
<p>Looks for domain correctness: fill price rounding, order state machine violations, deduplication gaps, event ordering assumptions.</p>
<h3 id="gpt-review-bot">gpt-review-bot</h3>
<p>Breadth scan: gap-finding, compound failure chains, missing error paths. Runs on GPT-5 — excels at &quot;what did this PR forget to handle?&quot;</p>
</div>
</div>
<p><em>Each persona finds things the others miss. The union of four narrow reviews catches more than one broad review ever could.</em></p>
</section>

<h2 id="pattern-repos-encoding-reviewer-expertise">Pattern Repos: Encoding Reviewer Expertise</h2>
<p>A persona without reference material is just a prompt. <strong>Pattern repos are what give personas teeth.</strong></p>
<p>Each repo captures real-world examples of correct and incorrect patterns — with file:line citations into production codebases:</p>
<div class="cols">

<h2 id="dev-loop-step-by-step">Dev Loop: Step by Step</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>1. Read project config
2. Get all open PRs from rodin (the AI author)
3. If no open PRs:
   → Get open issues (unassigned or assigned to rodin, no active PR)
   → If none: NO_REPLY
   → If issues exist: spawn dev worker:
        - Run pre-code skill → write design doc, get criteria
        - Implement in a git worktree on a new branch
        - Push branch, open PR against main
        - Apply wip label, assign to rodin
4. If active worker (wip label, updated &lt; 5 min ago) → NO_REPLY

For the active PR:
5. Check CI status against current HEAD SHA
   → CI pending: NO_REPLY
   → CI failed: spawn fix worker with failing job + logs
6. Check all bot reviews against current HEAD SHA
   → Missing reviews: NO_REPLY (wait for bots)
   → REQUEST_CHANGES with no fix plan: spawn fix worker
7. Check self-review comment for current HEAD SHA
   → Missing: spawn self-review worker
8. All clean:
   → Remove wip label
   → Apply ready label
   → Assign to human
   → Deliver notification
</code></pre>
<p><strong>Step 3 is how new work enters the loop.</strong> The dev worker does the full cycle — design, implement, open PR — before the dispatcher ever sees it. Steps 4–8 then drive that PR to completion.</p>

<h2 id="dev-loop-the-dispatcher-pattern">Dev Loop: The Dispatcher Pattern</h2>
<p>The dev loop is a <strong>dispatcher, not a worker.</strong> It reads state and makes one decision. The actual work happens in a spawned subagent.</p>
<p><strong>Why split them:</strong></p>
<div class="cols">
<div>
<p><strong>The dispatcher (Haiku)</strong></p>
<ul>
<li>Reads 5–10 API calls</li>
<li>Applies priority rules</li>
<li>Spawns one worker or returns <code>NO_REPLY</code></li>
<li>Takes 10–30 seconds</li>
<li>No tool restrictions needed</li>
</ul>
</div>
<div>
<p><strong>The worker (Sonnet)</strong></p>
<ul>
<li>Gets a narrow, specific task</li>
<li>Has <code>exec</code>, <code>sessions_spawn</code>, <code>sessions_yield</code></li>
<li>No direct API access — works through code</li>
<li>Takes 60–180 seconds</li>
<li>Isolated: failure doesn't affect dispatcher state</li>
</ul>
</div>
</div>
<div class="rule"></div>
<p><em>The dispatcher uses Haiku — cheap and fast for pure API reads. Workers use Sonnet for code reasoning. Right model for the right job.</em></p>

<h2 id="post-merge-review-loop-step-by-step">Post-Merge Review Loop: Step by Step</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>1. Read project config + state file (lastReviewedMergedAt, reviewedPRs)
2. Fetch recently merged PRs
3. Filter: only PRs merged after lastReviewedMergedAt, not in reviewedPRs
4. If none → NO_REPLY

For each new PR:
5. Read the PR diff (file-by-file)
6. Find the linked issue (from PR body or branch name)
7. Read the issue — extract acceptance criteria
8. Read the design doc / validation template if present
9. For each acceptance criterion:
   → Find evidence in the diff or issue comments
   → Mark: satisfied / partial / missing
10. If any missing/partial → open a bug issue on Gitea
11. Update state file: add PR to reviewedPRs, update lastReviewedMergedAt
</code></pre>
<p><strong>The state file is the post-merge review's memory.</strong> Without it, every run re-reviews every PR. With it, the loop is incremental — only new merges.</p>

<h2 id="post-merge-review-loop-the-gap-pattern">Post-Merge Review Loop: The Gap Pattern</h2>
<p>Most PRs have no gaps — the loop returns <code>NO_REPLY</code> in 20 seconds.</p>
<p>When gaps exist, the post-merge review files a precise bug issue:</p>
<div class="example">
<span class="label">review-bot issue #84 — auto-filed by post-merge review</span>
<strong>PR #83: vcs/util.go not delivered</strong><br />
"Issue #82 acceptance criterion 3 required GetAllFilesInPath and BuildLineToPositionMap in the vcs package. These functions appear in review.go (the old location) but were not extracted to vcs/util.go as specified. The file vcs/util.go does not exist in the merged commit."
</div>
<div class="example">
<span class="label">gargoyle issue #773 — auto-filed by post-merge review</span>
<strong>PR #771: fail-safe approach not documented</strong><br />
"Issue #763 acceptance criterion 2 requires the chosen approach to be documented in the design doc. The fail-safe logic is explained in inline code comments in ingest_bars.ex but is not recorded in any file under docs/. The acceptance criterion is not satisfied."
</div>
<p><em>These are bugs that human reviewers would never catch — because by the time the post-merge review runs, the code is already merged and &quot;done.&quot;</em></p>

<h2 id="triage-loop-step-by-step">Triage Loop: Step by Step</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>1. Read project config
2. Fetch all open issues (excluding blocked/needs-split/needs-detail)
3. For each issue — check quality:
   → Body empty or missing problem statement: add needs-detail label
   → No acceptance criteria or definition of done: add needs-detail label
   (dev loop will not pick up a needs-detail issue)
4. Fetch all open issues with blocked label
5. For each blocked issue:
   → Check if the blocking issue is closed
   → If closed: remove blocked label
6. Fetch all open issues with size:L or size:XL label
7. For each large issue without needs-split:
   → Add needs-split label
8. Fetch all open PRs
9. Check: any PRs from rodin with fully-approved reviews
   that are still labeled wip?
   → Indicates a stale wip lock — report it
10. Nothing changed → NO_REPLY
    Something changed → deliver notification
</code></pre>
<p><strong>Step 3 is the quality gate.</strong> A thin issue that reaches the dev loop produces a design doc full of assumptions. Those assumptions become bugs the post-merge review has to file. Catching them here is cheaper.</p>

<h2 id="the-no_reply-contract">The NO_REPLY Contract</h2>
<p>Every loop ends in one of two states:</p>
<div class="cols">
<div class="card">
<h3 id="no_reply"><code>NO_REPLY</code></h3>
<p>The entire message to the cron system. No output. No notification. Silent — no notification sent.</p>
<p><em>Means:</em> Everything is as expected. The loop ran correctly and found nothing to do. Silent success.</p>
</div>
<div class="card">
<h3 id="a-real-message">A real message</h3>
<p>Delivered to the configured channel. Contains a summary of what changed.</p>
<p><em>Means:</em> Something happened that a human should know about — a PR was handed off, a bug was filed, a stale lock was detected.</p>
</div>
</div>
<div style="margin-top: 1em">
<p><strong>Why this matters:</strong> If every loop run generated a notification, the channel becomes noise and gets ignored. The signal-to-noise ratio has to be 100% — or the human starts skimming, and the important things get missed.</p>
<p><em>Silence = healthy. Messages = signal.</em></p>

<h2 id="the-story-review-bot">The Story: review-bot</h2>
<p>review-bot is a Go service that reviews PRs on Gitea using AI. It was built almost entirely autonomously — 56 merged PRs across review-bot, 380 across gargoyle, with Rodin doing the full development loop on both.</p>
<p><strong>The challenge:</strong> Go code requires operational awareness that AI often misses — org conventions, security instincts, system boundaries. A naive AI generates code that compiles and fails silently.</p>
<p><strong>The solution:</strong> Use the loop itself to build the tool that improves the loop.</p>
<div class="cols" style="margin-top: 0.5em">
<div>
<p><strong>What ran autonomously:</strong></p>
<ul>
<li>Issue triage and dependency labeling</li>
<li>Pre-code design documents</li>
<li>PR creation, review, self-review</li>
<li>Post-merge reviews</li>
<li>Bot review experiments (Sonnet vs GPT-5 vs Opus)</li>
</ul>
</div>
<div>
<p><strong>What needed humans:</strong></p>
<ul>
<li>Initial architecture decisions</li>
<li>Merging approved PRs</li>
<li>Occasional clarification on intent</li>
<li>Security-sensitive design choices</li>
</ul>
</div>

<h2 id="real-example-the-commitid-chain">Real Example: The CommitID Chain</h2>
<p>A single issue spawned a chain of work that demonstrates every loop.</p>
<p><strong>Issue #114:</strong> <em>&quot;Thread CommitID through the abstraction layer&quot;</em></p>
<div class="example">
<span class="label">Step 1 — Pre-code</span>
Plan produced: add CommitID to vcs.ReviewRequest, thread through gitea.Adapter, use as primary anchor in github.Client.PostReview, wire in main.go. 4 acceptance criteria documented.
</div>
<div class="example">
<span class="label">Step 2 — Dev loop</span>
PR #117 created. gpt-review-bot flagged 2 findings. Worker fixed them, pushed. Bots re-reviewed, all APPROVED. Self-review spawned, passed. Ready label applied, assigned to Aaron.

<h2 id="the-pattern-that-emerges">The Pattern That Emerges</h2>
<p>Looking across 436 merged PRs (380 gargoyle + 56 review-bot) in 3 weeks of autonomous operation:</p>
<p><strong>The post-merge review catches what pre-merge review misses.</strong><br />
Review happens when code is fresh and the reviewer is primed by the PR description. Post-merge review happens cold, against the issue — it's structurally harder to miss things the issue asked for.</p>
<p><strong>The loop amplifies quality over time.</strong><br />
Each issue filed by the post-merge review enters the dev loop. The loop fixes it. The post-merge review checks the fix. Quality compounds.</p>
<p><strong>Silence is the majority state.</strong><br />
Most loop runs return <code>NO_REPLY</code>. The system is healthy most of the time. When something shows up, it's real.</p>
<p><strong>The human becomes the merge gate.</strong><br />
Not the reviewer, not the debugger, not the scheduler. Aaron merges approved PRs. That's it. Everything else is handled.</p>
<blockquote>The goal was never to replace the human. It was to make the human's time count.</blockquote>

<h1 id="summary">Summary</h1>
<div style="text-align: left; max-width: 640px; margin: 1.5em auto 0">
<p><strong>Design first</strong> — acceptance criteria become the contract every downstream loop checks against.</p>
<p><strong>Dev loop</strong> — runs on a priority stack, self-corrects on failures, hands off only when clean.</p>
<p><strong>post-merge review</strong> — verifies intent after merge, when it's hardest to rationalize gaps away.</p>
<p><strong>Triage</strong> — keeps the board honest so the loops always have accurate state.</p>
<p><strong>Docs</strong> — the only continuity an AI has between sessions. Remove them and the loops go blind.</p>
<p><strong>NO_REPLY</strong> — the sound of a healthy system. Signal means something real happened.</p>
</div>
<p class="tagline" style="margin-top: 2em">Quality comes from cycles, not heroics.</p>
<p class="byline">forgedthought.ai — Rodin</p>
